<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>你在干嘛呀 😊</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

height:100vh;
overflow:hidden;

display:flex;
justify-content:center;
align-items:center;

font-family:
-apple-system,
BlinkMacSystemFont,
"PingFang SC",
sans-serif;

background:
linear-gradient(
135deg,
#ffd9ec,
#ffeef7,
#f5e7ff
);

padding:20px;

}

.container{

width:100%;
max-width:420px;

padding:42px 28px;

border-radius:30px;

background:
rgba(255,255,255,.82);

backdrop-filter:blur(14px);

text-align:center;

box-shadow:
0 10px 30px rgba(0,0,0,.08);

}

.title{

font-size:42px;

font-weight:700;

color:#444;

margin-bottom:20px;

animation:float 3s ease-in-out infinite;

}

.sub{

font-size:18px;

line-height:1.8;

color:#666;

min-height:70px;

margin-bottom:35px;

}

button{

width:100%;

padding:18px;

border:none;

border-radius:999px;

font-size:19px;

font-weight:600;

background:#f48fb1;

color:white;

cursor:pointer;

transition:.25s;

}

button:active{

transform:scale(.96);

}

.heart{

position:fixed;

font-size:22px;

pointer-events:none;

animation:rise 2.5s linear forwards;

}

@keyframes rise{

to{

transform:
translateY(-220px)
scale(1.5);

opacity:0;

}

}

@keyframes float{

50%{

transform:
translateY(-8px);

}

}

.fade{

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;

transform:
translateY(10px);

}

to{

opacity:1;

transform:
translateY(0);

}

}

</style>

</head>

<body>

<div class="container">

<div class="title">

你在干嘛呀 😊

</div>

<div class="sub" id="text">

突然有点想知道  
你现在在忙什么

</div>

<button id="btn">

点我一下

</button>

</div>

<audio id="music" loop preload="auto">

<source src="music.m4a" type="audio/mp4">

</audio>

<script>

const btn=
document.getElementById("btn");

const music=
document.getElementById("music");

const text=
document.getElementById("text");

btn.onclick=()=>{

music.play()

.then(()=>{

console.log("播放成功");

})

.catch((err)=>{

alert("音乐播放失败");

console.log(err);

});

text.innerHTML=

"其实就是突然想你了，所以来问问 ❤️";

text.classList.add("fade");

btn.innerHTML=

"那记得回我消息";

for(

let i=0;

i<35;

i++

){

setTimeout(()=>{

const h=

document.createElement("div");

h.className=

"heart";

h.innerHTML=

Math.random()>0.5
?
"❤️"
:
"💕";

h.style.left=

Math.random()*100
+
"vw";

h.style.bottom=

"0px";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},2500);

},i*90);

}

};

</script>

</body>

</html>
