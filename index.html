<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>你在干嘛呀</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
width:100%;
height:100vh;
overflow:hidden;
font-family:"Microsoft YaHei";
background:linear-gradient(135deg,#ffd6ea,#f3d1ff,#ffd6d6);
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

.bg{
position:absolute;
width:100%;
height:100%;
overflow:hidden;
}

.heart{
position:absolute;
color:#ff5c9f;
animation:float 8s linear infinite;
opacity:.7;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(.5);
opacity:0;
}
50%{
opacity:1;
}
100%{
transform:translateY(-120px) scale(1.4);
opacity:0;
}
}

.card{
width:88%;
max-width:360px;
background:rgba(255,255,255,.86);
padding:35px 25px;
border-radius:25px;
backdrop-filter:blur(10px);
box-shadow:0 10px 35px rgba(0,0,0,.15);
text-align:center;
z-index:10;
}

.title{
font-size:38px;
font-weight:bold;
color:#333;
margin-bottom:15px;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.06)}
}

#text{
font-size:24px;
min-height:70px;
color:#555;
line-height:1.6;
margin:20px 0;
}

button{
border:none;
padding:15px 35px;
border-radius:50px;
background:#ff6cae;
color:#fff;
font-size:18px;
cursor:pointer;
}

.bigHeart{
font-size:90px;
margin-top:15px;
animation:beat 1s infinite;
display:none;
}

@keyframes beat{
0%,100%{transform:scale(1)}
50%{transform:scale(1.2)}
}

.tip{
margin-top:18px;
font-size:20px;
color:#ff4d94;
display:none;
}

.musicBtn{
position:fixed;
right:18px;
bottom:20px;
width:60px;
height:60px;
border-radius:50%;
background:#ff6cae;
display:flex;
justify-content:center;
align-items:center;
font-size:26px;
color:white;
z-index:99;
box-shadow:0 5px 20px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<div class="card">

<div class="title">你在干嘛呀 😊</div>

<div id="text"></div>

<button id="btn">
点我一下
</button>

<div class="bigHeart" id="heart">
❤️
</div>

<div class="tip" id="tip">
其实就是突然想你了，所以来问问 ❤️
</div>

</div>

<div class="musicBtn" id="musicBtn">
🎵
</div>

<audio id="music" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>

const words=[
"现在在忙吗",
"有没有偷偷摸鱼",
"我刚刚突然想到你",
"所以跑来问问",
"老实说",
"其实有点想你"
];

let i=0;
const text=document.getElementById("text");

function typeWord(){

if(i>=words.length)return;

let str=words[i];
let j=0;

text.innerHTML="";

let timer=setInterval(()=>{

text.innerHTML+=str[j];
j++;

if(j>=str.length){

clearInterval(timer);

setTimeout(()=>{

i++;
typeWord();

},1800);

}

},150);

}

typeWord();

document.getElementById("btn").onclick=()=>{

document.getElementById("heart").style.display="block";
document.getElementById("tip").style.display="block";

};

const music=document.getElementById("music");

document.getElementById("musicBtn").onclick=()=>{

music.play();

document.getElementById("musicBtn").style.display="none";

};

function createHeart(){

const h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*30)+"px";

h.style.animationDuration=
(5+Math.random()*5)+"s";

document.getElementById("bg").appendChild(h);

setTimeout(()=>{

h.remove();

},10000);

}

setInterval(createHeart,400);

document.body.addEventListener("click",(e)=>{

let heart=document.createElement("div");

heart.innerHTML="💗";

heart.style.position="absolute";

heart.style.left=e.clientX+"px";

heart.style.top=e.clientY+"px";

heart.style.fontSize="28px";

heart.style.pointerEvents="none";

document.body.appendChild(heart);

setTimeout(()=>{

heart.remove();

},800);

});

</script>

</body>
</html>
