<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>专属心意</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

overflow:hidden;

height:100vh;

font-family:"Microsoft YaHei";

background:
linear-gradient(
135deg,
#f6a9bf,
#f5bfd0
);

display:flex;

justify-content:center;

align-items:center;

position:relative;

}

.container{

position:relative;

z-index:10;

display:flex;

flex-direction:column;

align-items:center;

text-align:center;

padding:20px;

width:90%;

}

.photo{

width:180px;

height:180px;

border-radius:50%;

object-fit:cover;

border:6px solid white;

box-shadow:
0 0 30px rgba(255,255,255,.8);

animation:
float 3s infinite;

}

@keyframes float{

0%{transform:translateY(0)}

50%{transform:translateY(-10px)}

100%{transform:translateY(0)}

}

.title{

margin-top:25px;

font-size:58px;

font-weight:bold;

color:white;

}

.textbox{

margin-top:35px;

width:min(90%,850px);

padding:35px;

min-height:220px;

display:flex;

justify-content:center;

align-items:center;

border-radius:35px;

background:
rgba(
255,
255,
255,
0.15
);

backdrop-filter:
blur(15px);

color:white;

font-size:28px;

line-height:1.9;

font-weight:600;

text-shadow:
0 0 10px rgba(0,0,0,.08);

transition:.5s;

}

.tip{

margin-top:25px;

font-size:20px;

color:white;

}

.heart{

position:absolute;

pointer-events:none;

color:#ff5b82;

animation:
rise linear forwards;

}

@keyframes rise{

from{

transform:
translateY(0)
scale(.5);

opacity:1;

}

to{

transform:
translateY(-120vh)
scale(1.6);

opacity:0;

}

}

</style>
</head>

<body>

<script>

const USER_NAME="乖乖"

const TEXTS=[

"提笔写下这些话的时候，窗外的风似乎都温柔了几分，而我的脑海里，反反复复浮现的，都是你的模样。",

"我从来没想过，一个人的出现，会让原本平淡的日子开始有了期待。",

"会在清晨醒来的时候，下意识想和你说一句早安。",

"会在看到晚霞、遇见有趣的事、吃到好吃的东西时，第一个想分享给你。",

"也会在人群里寻找你的身影，因为一个眼神，让心跳乱了节奏。",

"这份喜欢，没有轰轰烈烈，却在细碎日常里慢慢生长。",

"你像一束温柔的光。",

"把原本普通的日子，都染上了期待的颜色。",

"我想把所有偏爱和温柔都留给你。",

"喜欢你，不是一时兴起。",

"而是在无数平凡瞬间里，越来越确定的答案。"

]

</script>

<div class="container">

<img
src="photo.jpg"
class="photo">

<div class="title">

乖乖，送给你

</div>

<div
class="textbox"
id="box">

</div>

<div class="tip" id="tip">

❤️ 点击屏幕播放音乐 ❤️

</div>

</div>

<audio
id="bgm"
loop>

<source
src="youwone.mp3"
type="audio/mpeg">

</audio>

<script>

document.body.addEventListener(

"click",

()=>{

document
.getElementById("bgm")
.play()

document
.getElementById("tip")
.style.display="none"

},

{once:true}

)
let index=0

function showSentence(){

const box=
document.getElementById(
"box"
)

box.style.opacity=0

setTimeout(()=>{

box.innerHTML=
TEXTS[index]

box.style.opacity=1

index++

if(index>=TEXTS.length){

index=0

}

},500)

}

showSentence()

setInterval(

showSentence,

5000

)

function heart(){

let h=
document.createElement(
"div"
)

h.className=
"heart"

h.innerHTML=
"❤"

h.style.left=
Math.random()*100+
"vw"

h.style.bottom=
"-30px"

h.style.fontSize=
Math.random()*35+
15+"px"

h.style.animationDuration=
Math.random()*5+
4+"s"

document.body.appendChild(h)

setTimeout(
()=>h.remove(),
8000
)

}

setInterval(
heart,
260
)

</script>

</body>

</html>
