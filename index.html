<!DOCTYPE html>
<html lang="zh">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>专属心意</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

overflow:hidden;

height:100vh;

font-family:"Microsoft YaHei";

background:
linear-gradient(
135deg,
#f6a8be,
#f6c7d3
);

display:flex;

justify-content:center;

align-items:center;

position:relative;

}

.container{

position:relative;

z-index:10;

display:flex;

flex-direction:column;

align-items:center;

text-align:center;

width:90%;

}

.photo{

width:190px;

height:190px;

border-radius:50%;

object-fit:cover;

border:6px solid white;

box-shadow:
0 0 35px rgba(255,255,255,.8);

animation:
float 3s infinite ease-in-out;

}

@keyframes float{

0%{
transform:translateY(0)
}

50%{
transform:translateY(-10px)
}

100%{
transform:translateY(0)
}

}

.title{

margin-top:25px;

font-size:56px;

font-weight:bold;

color:white;

text-shadow:
0 0 20px rgba(255,255,255,.25);

}

.textbox{

margin-top:35px;

width:min(90%,850px);

min-height:220px;

padding:35px;

display:flex;

justify-content:center;

align-items:center;

border-radius:35px;

background:

rgba(
255,
255,
255,
0.16
);

backdrop-filter:
blur(16px);

color:white;

font-size:28px;

line-height:1.9;

font-weight:600;

text-shadow:
0 0 10px rgba(0,0,0,.08);

opacity:0;

transition:.6s;

}

.tip{

margin-top:25px;

font-size:22px;

color:white;

}

.heart{

position:absolute;

pointer-events:none;

color:#ff5a82;

animation:
rise linear forwards;

}

@keyframes rise{

from{

transform:
translateY(0)
scale(.5);

opacity:1;

}

to{

transform:
translateY(-120vh)
scale(1.6);

opacity:0;

}

}

</style>

</head>

<body>

<script>

const TEXTS=[

"提笔写下这些话的时候，窗外的风似乎都温柔了几分，而我的脑海里，反反复复浮现的，都是你的模样。",

"我从来没想过，一个人的出现，会让原本平淡的日子开始有了期待。",

"会在清晨醒来的时候，下意识想和你说一句早安。",

"会在看到好看的晚霞、遇见有趣的事情、吃到好吃的东西时，第一个想分享给你。",

"也会在人群里，下意识寻找你的身影，因为一个眼神，让心跳乱了节奏。",

"这份喜欢，没有轰轰烈烈的开场。",

"却在一次次聊天，一句句关心里。",

"慢慢长成了藏不住的在意。",

"你像一束温柔的光。",

"把原本普通的日子。",

"都染上了期待的颜色。",

"喜欢你。",

"不是一时兴起。",

"而是在无数平凡瞬间里。",

"越来越确定的答案。"

]

</script>

<div class="container">

<img
src="photo.jpg"
class="photo">

<div class="title">

菲菲，送给你

</div>

<div
class="textbox"
id="box">

</div>

<div
class="tip"
id="tip">

❤️ 点击屏幕开启 ❤️

</div>

</div>

<audio
id="bgm"
loop>

<source
src="youwone.mp3"
type="audio/mpeg">

</audio>

<script>

const box =
document.getElementById(
"box"
)

let index=0

let started=false

function showSentence(){

box.style.opacity=0

setTimeout(()=>{

box.innerHTML=

TEXTS[index]

box.style.opacity=1

index++

if(index>=TEXTS.length){

index=0

}

},500)

}

document.body.addEventListener(

"click",

()=>{

if(started) return

started=true

document
.getElementById(
"tip"
)
.style.display="none"

document
.getElementById(
"bgm"
)
.play()

showSentence()

setInterval(

showSentence,

5000

)

},

{once:true}

)

function heart(){

let h=
document.createElement(
"div"
)

h.className=
"heart"

h.innerHTML=
"❤"

h.style.left=
Math.random()*100+
"vw"

h.style.bottom=
"-30px"

h.style.fontSize=
Math.random()*35+
15+"px"

h.style.animationDuration=
Math.random()*5+
4+"s"

document.body.appendChild(h)

setTimeout(
()=>h.remove(),
8000
)

}

setInterval(
heart,
260
)

</script>

</body>

</html>
