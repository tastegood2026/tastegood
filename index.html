<!DOCTYPE html>
<html lang="zh">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>专属心意</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:"Microsoft YaHei";

background:
linear-gradient(
180deg,
#f6a9bf,
#f7c8d5
);

min-height:100vh;

overflow-x:hidden;

position:relative;

}

.container{

position:relative;

z-index:10;

display:flex;

flex-direction:column;

align-items:center;

padding:60px 20px 120px;

}

.photo{

width:190px;

height:190px;

border-radius:50%;

object-fit:cover;

border:6px solid rgba(255,255,255,.95);

box-shadow:
0 0 35px rgba(255,255,255,.8);

animation:
floating 3s infinite ease-in-out;

}

@keyframes floating{

0%{
transform:translateY(0px)
}

50%{
transform:translateY(-12px)
}

100%{
transform:translateY(0px)
}

}

.title{

margin-top:30px;

font-size:58px;

font-weight:bold;

color:white;

text-align:center;

text-shadow:
0 0 20px rgba(255,255,255,.25);

}

.card{

margin-top:40px;

width:min(92%,820px);

padding:35px;

border-radius:35px;

background:

rgba(
255,
255,
255,
0.16
);

backdrop-filter:
blur(18px);

border:

1px solid rgba(
255,
255,
255,
0.35
);

box-shadow:

0 0 40px rgba(
255,
255,
255,
0.15
);

}

.text{

font-size:24px;

line-height:2.1;

color:white;

white-space:pre-line;

font-weight:500;

text-shadow:
0 0 8px rgba(0,0,0,.08);

}

.tip{

margin-top:25px;

font-size:20px;

color:white;

opacity:.95;

}

.heart{

position:absolute;

pointer-events:none;

color:#ff5d82;

animation:
rise linear forwards;

}

@keyframes rise{

from{

transform:
translateY(0)
scale(.5);

opacity:1;

}

to{

transform:
translateY(-120vh)
scale(1.5);

opacity:0;

}

}

@media(max-width:768px){

.title{

font-size:40px;

}

.text{

font-size:18px;

line-height:1.9;

}

.photo{

width:150px;

height:150px;

}

}

</style>

</head>

<body>

<script>

const USER_NAME =
"菲菲"

const PHOTO =
"photo.jpg"

const MUSIC =
"youwone.mp3"

const CONTENT = `

提笔写下这些话的时候，窗外的风似乎都温柔了几分，而我的脑海里，反反复复浮现的，都是你的模样。

我从来没想过，一个人的出现，会让原本平淡的日子开始有了期待。

会在清晨醒来的时候，下意识想和你说一句早安；

会在看到好看的晚霞、遇见有趣的事情、吃到好吃的东西时，第一时间想分享给你；

也会在人群里，下意识寻找你的身影，然后因为一个眼神、一句回应，让心跳悄悄乱了节奏。

这份喜欢，没有轰轰烈烈的开场，也没有刻意制造的浪漫。

它是在一次次聊天里，在一句句关心里，在那些细碎又平常的瞬间里，慢慢生根发芽，然后不知不觉长成了藏不住的在意。

我喜欢和你聊天时的轻松，喜欢你笑起来时眉眼弯弯的样子，也喜欢那种即使安静下来，也不会觉得尴尬的安心。

你像一束温柔的光，悄悄照进我的生活，把原本普通的日子，都染上了期待的颜色。

我不懂什么才算最完美的爱情，也不会说太多华丽动听的话。

我只知道，我想把所有的温柔和偏爱都留给你，想陪你走过春夏秋冬，想和你一起经历往后平凡却珍贵的每一天。

不用急着回应，也不用因为这些话有压力。

我只是想认认真真地告诉你：

喜欢你这件事，

不是一时兴起，

而是在无数个平凡瞬间里，

越来越确定的答案。

`

</script>

<div class="container">

<img
class="photo"
src="photo.jpg">

<div class="title">

菲菲，送给你

</div>

<div class="card">

<div
class="text"
id="content">

</div>

</div>

<div class="tip">

❤️ 点击页面播放音乐 ❤️

</div>

</div>

<audio
id="bgm"
loop>

<source
src="youwone.mp3"
type="audio/mpeg">

</audio>

<script>

document
.getElementById(
"content"
)
.innerText =
CONTENT

document.body
.addEventListener(

"click",

()=>{

document
.getElementById(
"bgm"
)
play()

},

{once:true}

)

function createHeart(){

let h=
document.createElement(
"div"
)

h.className=
"heart"

h.innerHTML=
"❤"

h.style.left=
Math.random()*100+
"vw"

h.style.bottom=
"-30px"

h.style.fontSize=
Math.random()*35+
15+"px"

h.style.animationDuration=
Math.random()*5+
4+"s"

document.body
.appendChild(h)

setTimeout(

()=>{

h.remove()

},

8000

)

}

setInterval(

createHeart,

260

)

</script>

</body>

</html>
