<!DOCTYPE html>
<html lang="zh">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>专属心意</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
"Microsoft YaHei";

background:
linear-gradient(
180deg,
#f7a9bd,
#f6bfd0
);

min-height:100vh;

overflow-x:hidden;

position:relative;
}

.container{

position:relative;

z-index:5;

display:flex;

flex-direction:column;

align-items:center;

padding:

60px 20px
120px;

}

.photo{

width:180px;

height:180px;

border-radius:50%;

object-fit:cover;

border:6px solid white;

box-shadow:
0 0 30px rgba(255,255,255,.8);

animation:
float 3s infinite;
}

@keyframes float{

0%{transform:translateY(0)}

50%{transform:translateY(-10px)}

100%{transform:translateY(0)}

}

.title{

margin-top:30px;

font-size:55px;

font-weight:bold;

color:white;

text-align:center;

text-shadow:
0 0 20px rgba(255,255,255,.3);

}

.card{

margin-top:35px;

width:min(90%,800px);

padding:

35px;

background:

rgba(
255,
255,
255,
0.18
);

backdrop-filter:
blur(12px);

border:

1px solid rgba(
255,
255,
255,
0.4
);

border-radius:

35px;

box-shadow:

0 0 35px rgba(
255,
255,
255,
0.15
);

}

.text{

font-size:26px;

line-height:2;

color:white;

font-weight:500;

white-space:pre-line;

text-shadow:
0 0 8px rgba(0,0,0,.08);

}

.music-tip{

margin-top:30px;

font-size:22px;

color:white;

}

.heart{

position:absolute;

pointer-events:none;

animation:

rise linear forwards;

color:#ff5d80;
}

@keyframes rise{

from{

transform:
translateY(0)
scale(.5);

opacity:1;

}

to{

transform:
translateY(-120vh)
scale(1.5);

opacity:0;

}

}

</style>

</head>

<body>

<script>

const USER_NAME =
"乖乖"

const PHOTO =
"photo.jpg"

const MUSIC =
"youwone.mp3"

const CONTENT = `

提笔写下这些话的时候，窗外的风似乎都温柔了几分，而我的脑海里，反反复复浮现的，都是你的模样。

我从来没想过，一个人的出现，会让原本平淡的日子开始有了期待。

会在清晨醒来的时候，下意识想和你说一句早安；

会在看到好看的晚霞、遇见有趣的事情、吃到好吃的东西时，第一时间想分享给你；

也会在人群里，下意识寻找你的身影，然后因为一个眼神、一句回应，让心跳悄悄乱了节奏。

这份喜欢，没有轰轰烈烈的开场，也没有刻意制造的浪漫。

它是在一次次聊天里，在一句句关心里，在那些细碎又平常的瞬间里，慢慢生根发芽，然后不知不觉长成了藏不住的在意。

我喜欢和你聊天时的轻松，喜欢你笑起来时眉眼弯弯的样子，也喜欢那种即使安静下来，也不会觉得尴尬的安心。

你像一束温柔的光，悄悄照进我的生活，把原本普通的日子，都染上了期待的颜色。

我不懂什么才算最完美的爱情，也不会说太多华丽动听的话。

我只知道，我想把所有的温柔和偏爱都留给你，想陪你走过春夏秋冬，想和你一起经历往后平凡却珍贵的每一天。

不用急着回应，也不用因为这些话有压力。

我只是想认认真真地告诉你：

喜欢你这件事，

不是一时兴起，

而是在无数个平凡瞬间里，

越来越确定的答案。

`

</script>

<div class="container">

<img
src="photo.jpg"
class="photo">

<div class="title">

乖乖，送给你

</div>

<div class="card">

<div
class="text"
id="content">

</div>

</div>

<div class="music-tip">

❤️ 点击页面播放音乐 ❤️

</div>

</div>

<audio
id="bgm"
loop>

<source
src="youwone.mp3">

</audio>

<script>

document
.getElementById(
"content"
)
.innerText =
CONTENT

document.body
.addEventListener(

"click",

()=>{

document
.getElementById(
"bgm"
)
.play()

},

{once:true}

)

function heart(){

let h=
document.createElement(
"div"
)

h.className=
"heart"

h.innerHTML=
"❤"

h.style.left=
Math.random()*100+
"vw"

h.style.bottom=
"-30px"

h.style.fontSize=
Math.random()*35+
15+"px"

h.style.animationDuration=
Math.random()*5+
4+"s"

document.body
.appendChild(h)

setTimeout(
()=>h.remove(),
8000
)

}

setInterval(
heart,
280
)

</script>

</body>

</html>
