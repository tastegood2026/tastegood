<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>你在干嘛呀</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
height:100vh;
font-family:"Microsoft YaHei";
background:black;
}

#bg{
position:fixed;
width:100%;
height:100%;
object-fit:cover;
filter:blur(6px) brightness(.45);
z-index:-2;
}

#overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,.15);
z-index:-1;
}

#stars{

position:fixed;

width:100%;

height:100%;

overflow:hidden;

pointer-events:none;
}

.star{

position:absolute;

color:white;

opacity:.8;

animation:fall linear forwards;
}

@keyframes fall{

from{

transform:translateY(-50px);

opacity:0;
}

20%{

opacity:1;
}

to{

transform:translateY(110vh);

opacity:0;
}

}

.container{

height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:20px;

text-align:center;
}

.avatar{

width:130px;

height:130px;

border-radius:50%;

overflow:hidden;

border:4px solid rgba(255,255,255,.9);

box-shadow:0 0 30px rgba(255,255,255,.5);

animation:breath 2.8s infinite;
}

.avatar img{

width:100%;

height:100%;

object-fit:cover;
}

@keyframes breath{

50%{

transform:scale(1.06);

}

}

#text{

margin-top:35px;

font-size:30px;

font-weight:bold;

line-height:1.6;

color:white;

min-height:100px;

padding:0 20px;

opacity:0;

transition:1s;

text-shadow:0 0 15px rgba(255,255,255,.4);

}

#start{

position:fixed;

inset:0;

display:flex;

justify-content:center;

align-items:center;

background:black;

z-index:100;
}

#btn{

padding:18px 45px;

font-size:22px;

border:none;

border-radius:999px;

background:#ff7eb6;

color:white;

box-shadow:0 0 20px rgba(255,126,182,.5);

}

.tip{

margin-top:18px;

color:white;

opacity:.8;

font-size:14px;
}

@media(max-width:600px){

.avatar{

width:115px;

height:115px;

}

#text{

font-size:24px;

}

}

</style>
</head>

<body>

<img src="bg.jpg" id="bg">

<div id="overlay"></div>

<div id="stars"></div>

<div id="start">

<div>

<button id="btn">

点一下 ❤️

</button>

<div class="tip">

偷偷给你准备了点东西

</div>

</div>

</div>

<div class="container">

<div class="avatar">

<img src="avatar.jpg">

</div>

<div id="text"></div>

</div>

<audio id="music" loop>

<source src="music.mp3" type="audio/mpeg">

</audio>

<script>

const lines=[

"你在干嘛呀",

"我有点想你了",

"我猜你现在应该睡着了",

"看你上班好累",

"睡着很正常",

"我也在忙呢",

"但是还是想问问你有没有在忙",

"还有就是",

"有没有想过我",

"没事没事",

"我随便说说的",

"miss you ❤️"

]

const text=document.getElementById("text")

const music=document.getElementById("music")

let i=0

function typeLine(line,index=0){

if(index===0){

text.innerHTML=""

text.style.opacity=1

}

if(index<line.length){

text.innerHTML += line[index]

setTimeout(()=>{

typeLine(line,index+1)

},180)

}else{

if(i===lines.length-1){

moreStars()

return

}

setTimeout(()=>{

text.style.opacity=0

setTimeout(()=>{

i++

typeLine(lines[i])

},900)

},2200)

}

}

function createStars(){

setInterval(()=>{

const star=document.createElement("div")

star.className="star"

star.innerHTML=Math.random()>0.5?"✦":"✧"

star.style.left=Math.random()*100+"vw"

star.style.fontSize=(Math.random()*12+8)+"px"

star.style.animationDuration=(Math.random()*5+4)+"s"

document.getElementById("stars").appendChild(star)

setTimeout(()=>{

star.remove()

},9000)

},180)

}

function moreStars(){

setInterval(()=>{

const star=document.createElement("div")

star.className="star"

star.innerHTML="✨"

star.style.left=Math.random()*100+"vw"

star.style.fontSize="20px"

star.style.animationDuration="4s"

document.getElementById("stars").appendChild(star)

setTimeout(()=>{

star.remove()

},5000)

},120)

}

document.getElementById("btn").onclick=()=>{

document.getElementById("start").remove()

music.play()

createStars()

typeLine(lines[0])

}

</script>

</body>
</html>
