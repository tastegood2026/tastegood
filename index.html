<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>专属心意</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

width:100vw;
height:100vh;

overflow:hidden;

font-family:
"Microsoft YaHei";

background:
linear-gradient(
135deg,
#f6a8ba,
#f4c6d2
);

position:relative;
}

.container{

position:relative;

z-index:5;

height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:20px;
}

.photo{

width:180px;

height:180px;

border-radius:50%;

object-fit:cover;

border:6px solid white;

box-shadow:
0 0 25px rgba(255,255,255,.7);

animation:
float 3s infinite ease-in-out;
}

h1{

margin-top:30px;

font-size:58px;

color:white;

font-weight:bold;
}

.text{

margin-top:30px;

font-size:28px;

color:white;

line-height:1.8;

min-height:60px;

width:85%;

font-weight:600;

text-shadow:
0 0 10px rgba(0,0,0,.1);
}

.tip{

margin-top:40px;

font-size:18px;

color:white;

opacity:.9;
}

.heart{

position:absolute;

pointer-events:none;

animation:
rise linear forwards;

color:#ff5a7b;
}

@keyframes rise{

from{

transform:
translateY(0)
scale(.6);

opacity:1;
}

to{

transform:
translateY(-110vh)
scale(1.5);

opacity:0;
}

}

@keyframes float{

0%{
transform:translateY(0);
}

50%{
transform:translateY(-12px);
}

100%{
transform:translateY(0);
}

}

</style>

</head>

<body>

<script>

/* ===== 修改这里 ===== */

const USER_NAME = "小雨"

const MESSAGE = [

"第一次认真准备这份心意",

"希望你打开的时候会笑",

"想把温柔和浪漫都送给你",

"未来的故事，希望有你"

]

const PHOTO = "photo.jpg"

const MUSIC = "youwone.mp3"

/* ================= */

</script>

<div class="container">

<img
class="photo"
id="photo">

<h1 id="title"></h1>

<div
class="text"
id="typing">

</div>

<div class="tip">

❤️ 点击屏幕播放音乐，微信打开效果最佳 ❤️

</div>

</div>

<audio
id="bgm"
loop>

<source
id="musicSource"
type="audio/mpeg">

</audio>

<script>

/* 初始化 */

document
.getElementById("photo")
.src = PHOTO

document
.getElementById("title")
.innerHTML =
USER_NAME + "，送给你"

document
.getElementById("musicSource")
.src = MUSIC

/* 点击播放音乐 */

document.body
.addEventListener(

"click",

()=>{

document
.getElementById("bgm")
.play()

},

{once:true}

)

/* 文字轮播 */

let msgIndex = 0

function showText(){

const box =
document.getElementById(
"typing"
)

box.style.opacity=0

setTimeout(()=>{

box.innerHTML =
MESSAGE[msgIndex]

box.style.opacity=1

msgIndex++

if(
msgIndex >=
MESSAGE.length
){

msgIndex = 0

}

},300)

}

showText()

setInterval(

showText,

2500

)

/* 飘心 */

function heart(){

let h =
document
.createElement(
"div"
)

h.className =
"heart"

h.innerHTML =
"❤"

h.style.left =
Math.random()*100
+"vw"

h.style.bottom =
"-30px"

h.style.fontSize =
Math.random()*30
+20+"px"

h.style.animationDuration =
Math.random()*4
+4+"s"

document.body
.appendChild(h)

setTimeout(()=>{

h.remove()

},7000)

}

setInterval(

heart,

300

)

</script>

</body>

</html>
