<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>你在干嘛呀？😏 沙雕版狂欢</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  overflow:hidden;
  height:100vh;
  font-family:"Microsoft YaHei";
  background: linear-gradient(45deg,#ff0,#f0f,#0ff,#0f0);
  background-size:400% 400%;
  animation:bgAnim 8s linear infinite, shake 0.1s infinite alternate;
}

@keyframes bgAnim{
  0%{background-position:0% 0%}
  25%{background-position:100% 0%}
  50%{background-position:100% 100%}
  75%{background-position:0% 100%}
  100%{background-position:0% 0%}
}
@keyframes shake{
  0%{transform:translate(0,0);}
  25%{transform:translate(2px,-1px);}
  50%{transform:translate(-2px,1px);}
  75%{transform:translate(1px,-2px);}
  100%{transform:translate(-1px,1px);}
}

#centerBox{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
}

#text{
  font-size:36px;
  font-weight:bold;
  color:#fff;
  text-shadow:2px 2px 5px #000;
}

.bounce{
  animation:bounceAnim 0.6s;
}
@keyframes bounceAnim{
  0%{transform:scale(1);}
  25%{transform:scale(1.3) rotate(-5deg);}
  50%{transform:scale(0.9) rotate(5deg);}
  75%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

#nextBtn{
  margin-top:30px;
  padding:15px 30px;
  font-size:18px;
  border:none;
  border-radius:50px;
  cursor:pointer;
  background:white;
  color:#ff0;
  font-weight:bold;
}

canvas{position:fixed;top:0;left:0;}

#musicBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  padding:10px 15px;
  font-size:18px;
  border-radius:50px;
  border:none;
  cursor:pointer;
  background:white;
  z-index:20;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="centerBox">
  <div id="text">嘿嘿，你在干嘛呀？😏</div>
  <button id="nextBtn">点我一下 😎</button>
</div>

<button id="musicBtn">🎵搞笑音乐</button>
<audio id="bgm" loop>
  <source src="funny.mp3">
</audio>

<script>
const texts=[
  "偷看我了吗？👀",
  "快说说，你在干嘛！",
  "不说我就吃掉你的薯片 🍟",
  "开玩笑啦 😂",
  "反正我很想你啦 😎"
];

const textDiv=document.getElementById("text");
let i=0;

async function showTexts(){
  while(i<texts.length){
    textDiv.innerHTML=texts[i];
    textDiv.classList.add("bounce");
    await sleep(800);
    textDiv.classList.remove("bounce");
    await sleep(2000);
    i++;
  }
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

setTimeout(showTexts,1000);

document.getElementById("musicBtn").onclick=()=>{
  document.getElementById("bgm").play();
  document.getElementById("musicBtn").style.display="none";
};

document.getElementById("nextBtn").onclick=()=>{
  document.getElementById("nextBtn").remove();
  textDiv.innerHTML="😝😝😝 巨型滑稽表情来啦 😝😝😝";
  textDiv.style.fontSize="50px";
  createParticles();
  createEmojiRain();
};

// 彩色粒子效果
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;
let particles=[];
function createParticles(){
  for(let i=0;i<200;i++){
    particles.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*15+5,
      dx:(Math.random()-0.5)*8,
      dy:(Math.random()-0.5)*8,
      color:`hsl(${Math.random()*360},100%,60%)`
    });
  }
  animateParticles();
}
function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let p of particles){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
    p.x+=p.dx;
    p.y+=p.dy;
    if(p.x<0||p.x>canvas.width)p.dx*=-1;
    if(p.y<0||p.y>canvas.height)p.dy*=-1;
  }
  requestAnimationFrame(animateParticles);
}

// 全屏 emoji 雨
let emojiRain=[];
function createEmojiRain(){
  setInterval(()=>{
    emojiRain.push({
      x:Math.random()*canvas.width,
      y:-50,
      emoji:["😂","😎","🍟","🤪","👀"][Math.floor(Math.random()*5)],
      speed:2+Math.random()*4,
      fontSize:24+Math.random()*24
    });
  },100);
  animateEmojiRain();
}
function animateEmojiRain(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let p of particles){
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
  }
  for(let e of emojiRain){
    ctx.font=e.fontSize+"px Arial";
    ctx.fillText(e.emoji,e.x,e.y);
    e.y+=e.speed;
  }
  emojiRain=emojiRain.filter(e=>e.y<canvas.height+50);
  requestAnimationFrame(animateEmojiRain);
}

// 点击屏幕生成 emoji 飞溅
document.addEventListener("click",e=>{
  for(let j=0;j<10;j++){
    let em=document.createElement("div");
    em.innerHTML=["😂","😎","🍟","🤪","👀"][Math.floor(Math.random()*5)];
    em.style.position="absolute";
    em.style.left=e.pageX+"px";
    em.style.top=e.pageY+"px";
    em.style.fontSize="24px";
    em.style.transition="1s";
    document.body.appendChild(em);
    setTimeout(()=>{
      em.style.transform=`translate(${Math.random()*200-100}px,${Math.random()*200-100}px) rotate(${Math.random()*360}deg)`;
      em.style.opacity=0;
    },10);
    setTimeout(()=>em.remove(),1000);
  }
});

// 鼠标拖尾 emoji
document.addEventListener("mousemove",e=>{
  let t=document.createElement("div");
  t.innerHTML=["😜","💥","🤣","👀"][Math.floor(Math.random()*4)];
  t.style.position="absolute";
  t.style.left=e.pageX+"px";
  t.style.top=e.pageY+"px";
  t.style.fontSize="18px";
  t.style.pointerEvents="none";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),500);
});
</script>

</body>
</html>
